  The table-invite link page: https://arcturatech.com/linnea/t/#k=<43 base64url>. The token is in the FRAGMENT, so it
  never reaches GitHub Pages, a link-preview crawler or a proxy log; the page reads location.hash and sends it only in

  request (the Content-Security-Policy below allows exactly the preview call and the site's own images).

  Shows only what the preview returns for an open link: the inviter's chosen name, which meal, the date, the dish
  names (≤ 12, then 「等 N 道」) and the link's 「邀请码 ABCD-2345」 with 复制 (the preview returns `short_code` to a token

  nutrition number and no health word; no reward wording (docs/45 §5.2). Every
  string is set with textContent (never innerHTML), so a label or dish name cannot inject markup.

  Strings: deploy/web/table/strings.json (zh-Hans, zh-Hant, en), inlined below between the LINNEA-STRINGS markers by
  `node deploy/web/build-link-pages.mjs` (its check mode fails when they differ). Language: the invite's locale (the
  inviter's app language) once the preview answers, else the browser's; the 简 / 繁 / EN switch overrides it.

  The draft keeps a placeholder in LINNEA_PREVIEW.anonKey; `node deploy/web/build-link-pages.mjs` in its out mode
  (called by deploy/web/site-push.sh) writes the published copy with the PROD anon key from apps/nourishrx/.env.production

  }

  function load() {
    state = { kind: "loading" };
    render();
    if (token === null) { state = { kind: "not_found" }; render(); return; }
    fetch(LINNEA_PREVIEW.url, {
      method: "POST",
      mode: "cors",
      credentials: "omit",
      cache: "no-store",
      referrerPolicy: "no-referrer",
      headers: { "content-type": "application/json", "authorization": "Bearer " + LINNEA_PREVIEW.anonKey, "apikey": LINNEA_PREVIEW.anonKey },
      body: JSON.stringify({ token: token })
    }).then(function (response) {
      return response.json().catch(function () { return null; }).then(function (body) { return { status: response.status, body: body }; });
    }).then(function (answer) {
      var body = answer.body;
      if (answer.status === 429) { state = { kind: "rate_limited" }; }
      else if (body && body.ok === true && body.data) {
        var data = body.data;
        if (!chosen) lang = langFromLocale(data.locale) || lang;
        if (data.status === "open" && Array.isArray(data.dishes)) state = { kind: "open", preview: data };
        else if (data.status === "claimed" || data.status === "expired" || data.status === "revoked") state = { kind: data.status };
        else state = { kind: "not_found" };
      } else if (answer.status === 404) { state = { kind: "not_found" }; }
      else { state = { kind: "rate_limited" }; }
      render();
    }).catch(function () {
      state = { kind: "offline" };
      render();
    });
  }

  $("langs").addEventListener("click", function (event) {
    var target = event.target.closest ? event.target.closest("button[data-lang]") : null;
    if (!target) return;
    lang = target.getAttribute("data-lang");
    chosen = true;
    render();
  });
  $("retry").addEventListener("click", load);
  $("copy").addEventListener("click", function () {
    var text = $("code-value").textContent;
    var done = function () { $("copy").textContent = s("copied"); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () {});
  });
  $("learn").href = LANDING;
  if (BLOCKING_IN_APP.test(ua)) $("in-app").hidden = false;
  load();
})();
</script>
</body>
</html>
