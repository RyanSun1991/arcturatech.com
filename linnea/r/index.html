<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<!--
  F-1613c / F-1614 (docs/43 §1.4, §5.4) — https://arcturatech.com/linnea/r/ (site repo: linnea/r/index.html).
  The referral landing page: https://arcturatech.com/linnea/r/#c=<R + 7>. The code is in the FRAGMENT (never sent to
  GitHub Pages, a crawler or a proxy log). Static: NO server call (the CSP's connect-src is 'none'), no cookie, no
  storage, no analytics, no third-party request, no name of the referrer. Every string is set with textContent.

  Shows: 「朋友邀请你试试 Linnea」, the reward line with its terms right under it (3.1.2 / FTC: the terms where the reward
  appears; docs/43 §5.4 copy, owner-review #6 approved as drafted), the store link — App Store `pt` + `ct=referral`,
  Play with the install referrer `utm_source=referral&c=<code>` (the app parks it, F-1614b2), both badges on a
  computer — and the code with 复制 (iOS has no install referrer: 「有邀请码？」 on the first screen). In WeChat and the
  other in-app browsers that block store links (docs/45 §1.5, §5.2) the reward wording is NOT shown, only the overlay.
  No "open the app" button: the app has no scheme form for a referral code, and a Universal Link tapped on its own
  domain stays in Safari; a link tapped anywhere else opens the installed app directly (AASA /linnea/r/*).

  Strings: deploy/web/referral/strings.json (zh-Hans, zh-Hant, en), inlined by `node deploy/web/build-link-pages.mjs`.
-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Linnea</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<style>
  :root {
    color-scheme: light dark;
    --bg: #F2F2F7; --card: #FFFFFF; --label: #000000; --secondary: #6B6B70; --separator: rgba(60, 60, 67, 0.2);
    --tint: #2B7350; --tint-pressed: #1F5A3E; --on-tint: #FFFFFF; --link: #0066CC; --gray-fill: #E5E5EA;
    --scrim: rgba(0, 0, 0, 0.45);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --card: #1C1C1E; --label: #FFFFFF; --secondary: #98989F; --separator: rgba(84, 84, 88, 0.6);
      --tint: #5FC48E; --tint-pressed: #5FC48E; --on-tint: #000000; --link: #4DB0FF; --gray-fill: #2C2C30;
      --scrim: rgba(0, 0, 0, 0.6);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--label);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "PingFang TC", "Hiragino Sans",
      Roboto, "Noto Sans CJK SC", "Noto Sans CJK TC", "Helvetica Neue", Arial, sans-serif;
  }
  :lang(zh-Hant) body, body:lang(zh-Hant) { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "PingFang HK", Roboto, "Noto Sans CJK TC", sans-serif; }
  main { max-width: 540px; margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom)); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
  .mark { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 17px; }
  .mark img { width: 40px; height: 40px; border-radius: 9px; }
  .langs { display: flex; gap: 4px; }
  .langs button {
    min-width: 44px; min-height: 44px; border: 0; border-radius: 22px; background: transparent; color: var(--link);
    font: inherit; font-size: 15px; cursor: pointer; padding: 0 10px;
  }
  .langs button[aria-pressed="true"] { background: var(--gray-fill); color: var(--label); font-weight: 600; }
  h1 { font-size: 28px; line-height: 1.2; font-weight: 700; margin: 0 0 6px; overflow-wrap: anywhere; }
  .meta { color: var(--secondary); font-size: 15px; margin: 0 0 20px; }
  .card { background: var(--card); border-radius: 24px; padding: 8px 0; margin: 0 0 20px; }
  .card h2 { font-size: 13px; font-weight: 400; color: var(--secondary); margin: 0; padding: 8px 20px 4px; }
  .card ul { list-style: none; margin: 0; padding: 0; }
  .card li { padding: 11px 20px; border-top: 0.5px solid var(--separator); overflow-wrap: anywhere; }
  .card li:first-child { border-top: 0; }
  .card li.more { color: var(--secondary); }
  .actions { display: flex; flex-direction: column; gap: 12px; margin: 0 0 20px; }
  .button {
    display: flex; align-items: center; justify-content: center; text-align: center; min-height: 50px;
    padding: 12px 20px; border-radius: 14px; font-weight: 600; text-decoration: none; font-size: 17px; border: 0;
    cursor: pointer; font-family: inherit;
  }
  .button.prominent { background: var(--tint); color: var(--on-tint); }
  .button.prominent:active { background: var(--tint-pressed); opacity: 0.85; }
  .button.gray { background: var(--gray-fill); color: var(--label); font-weight: 500; }
  .button.plain { background: transparent; color: var(--link); font-weight: 500; min-height: 44px; }
  .stores { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .stores a { display: inline-flex; min-height: 44px; align-items: center; }
  .stores img { height: 44px; width: auto; }
  .note { color: var(--secondary); font-size: 15px; text-align: center; margin: 0; }
  .code { background: var(--card); border-radius: 24px; padding: 16px 20px; margin: 0 0 20px; }
  .code-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .code-label { color: var(--secondary); font-size: 15px; }
  .code-value { font-size: 24px; font-weight: 600; letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }
  .code .button { min-height: 44px; padding: 8px 16px; font-size: 15px; }
  .state { text-align: center; padding: 32px 0; }
  .state h1 { margin-bottom: 20px; }
  footer { border-top: 0.5px solid var(--separator); padding-top: 16px; margin-top: 8px; color: var(--secondary); font-size: 13px; }
  footer p { margin: 0 0 8px; }
  footer a { color: var(--link); display: inline-flex; min-height: 44px; align-items: center; margin-right: 16px; }
  .overlay {
    position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: flex-start; justify-content: flex-end;
    padding: 12px 16px; z-index: 10;
  }
  .overlay p { background: var(--card); color: var(--label); border-radius: 14px; padding: 14px 16px; margin: 0; max-width: 320px; font-weight: 600; }
  .lead { font-size: 17px; margin: 0 0 12px; }
  .terms { color: var(--secondary); font-size: 15px; margin: 0 0 20px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: no-preference) { .button { transition: background-color 0.15s; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="mark"><img src="/linnea/img/icon-160.png" alt="" width="40" height="40"><span>Linnea</span></div>
    <nav class="langs" id="langs">
      <button type="button" data-lang="zh-Hans" lang="zh-Hans">简<span class="sr">体中文</span></button>
      <button type="button" data-lang="zh-Hant" lang="zh-Hant">繁<span class="sr">體中文</span></button>
      <button type="button" data-lang="en" lang="en">EN<span class="sr"> · English</span></button>
    </nav>
  </div>

  <section id="open" hidden>
    <h1 id="title"></h1>
    <div id="reward-block">
      <p class="lead" id="reward"></p>
      <p class="terms" id="terms"></p>
    </div>
    <div class="actions">
      <a class="button prominent" id="download" href="https://arcturatech.com/linnea/?ct=referral"></a>
      <div class="stores" id="stores" hidden>
        <a id="store-ios" href="#"><img id="badge-ios" alt="App Store" src="/linnea/img/badge-app-store-zh-hans.svg"></a>
        <a id="store-android" href="#"><img id="badge-android" alt="Google Play" src="/linnea/img/badge-google-play-zh-hans.svg"></a>
      </div>
    </div>
    <div class="code" id="code-box">
      <div class="code-row">
        <div><div class="code-label" id="code-label"></div><div class="code-value" id="code-value"></div></div>
        <button type="button" class="button gray" id="copy"></button>
      </div>
      <p class="note" id="code-hint" style="text-align:left;margin-top:8px"></p>
    </div>
  </section>

  <section id="closed" class="state" hidden>
    <h1 id="closed-title"></h1>
    <div class="actions">
      <a class="button gray" id="learn" href="https://arcturatech.com/linnea/?ct=referral"></a>
    </div>
  </section>

  <footer>
    <p id="disclaimer"></p>
    <a id="privacy" href="/linnea/privacy.html"></a><a id="report" href="mailto:support@arcturatech.com"></a>
  </footer>
</main>
<div class="overlay" id="in-app" hidden role="alert"><p id="in-app-text"></p></div>

<script>
(function () {
  "use strict";
  var APP_STORE = "https://apps.apple.com/app/apple-store/id6765480037?pt=128850178&ct=referral&mt=8";
  var PLAY = "https://play.google.com/store/apps/details?id=com.nourishrx.app";
  var LANDING = "https://arcturatech.com/linnea/?ct=referral";
  /* `R` + 7 Crockford symbols (lib/contracts/table-invites.ts), typed forgivingly like the app does. */
  var REFERRAL = /^R[0-9A-HJKMNP-TV-Z]{7}$/;
  var raw = document.getElementById("linnea-strings").textContent;
  var STRINGS = JSON.parse(raw.replace(/<!--[\s\S]*?-->/g, ""));
  var $ = function (id) { return document.getElementById(id); };
  var ua = navigator.userAgent || "";
  var platform = /Android/i.test(ua) ? "android" : /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? "ios" : "other";
  /* Browsers that block store links and Universal Links (docs/43 §1.4). */
  var BLOCKING_IN_APP = /MicroMessenger|Weibo|DingTalk|AlipayClient| QQ\//i;
  var inApp = BLOCKING_IN_APP.test(ua);

  function param(text, key) {
    var parts = text.replace(/^[#?]/, "").split("&");
    for (var i = 0; i < parts.length; i++) {
      var eq = parts[i].indexOf("=");
      if (eq > 0 && parts[i].slice(0, eq) === key) {
        try { return decodeURIComponent(parts[i].slice(eq + 1)); } catch (e) { return null; }
      }
    }
    return null;
  }
  function langFromLocale(locale) {
    if (!locale) return null;
    if (/^zh[-_](TW|HK|MO|Hant)/i.test(locale)) return "zh-Hant";
    if (/^zh/i.test(locale)) return "zh-Hans";
    return "en";
  }
  var lang = langFromLocale(navigator.language) || "zh-Hans";
  function s(key) { return STRINGS[lang][key]; }
  function renderCommon() {
    document.documentElement.lang = s("html_lang");
    document.title = s("page_title");
    var buttons = $("langs").querySelectorAll("button");
    for (var i = 0; i < buttons.length; i++) buttons[i].setAttribute("aria-pressed", String(buttons[i].getAttribute("data-lang") === lang));
    $("langs").setAttribute("aria-label", s("switch_label"));
    $("disclaimer").textContent = s("disclaimer");
    $("privacy").textContent = s("privacy");
    $("report").textContent = s("report");
    $("report").href = "mailto:support@arcturatech.com?subject=" + encodeURIComponent(s("report_subject"));
    $("in-app-text").textContent = s("in_app");
    var badge = lang === "zh-Hant" ? "zh-hant" : lang === "en" ? "en" : "zh-hans";
    $("badge-ios").src = "/linnea/img/badge-app-store-" + badge + ".svg";
    $("badge-android").src = "/linnea/img/badge-google-play-" + badge + ".svg";
  }

  function normalise(raw) {
    return String(raw).toUpperCase().replace(/[\s-]/g, "").replace(/O/g, "0").replace(/[IL]/g, "1");
  }
  var raw = param(location.hash, "c");
  var code = raw === null ? null : normalise(raw);
  if (code !== null && !REFERRAL.test(code)) code = null;
  function playUrl() { return PLAY + "&referrer=" + encodeURIComponent("utm_source=referral&c=" + code); }

  function render() {
    renderCommon();
    $("learn").textContent = s("learn");
    if (code === null) {
      $("closed-title").textContent = s("not_found");
      $("open").hidden = true;
      $("closed").hidden = false;
      return;
    }
    $("title").textContent = s("title");
    $("reward").textContent = s("reward");
    $("terms").textContent = s("terms");
    /* No reward wording inside WeChat and the like (docs/45 §1.5); the overlay asks for a real browser. */
    $("reward-block").hidden = inApp;
    $("download").textContent = s("download");
    if (platform === "other") {
      $("download").hidden = true;
      $("stores").hidden = false;
      $("store-ios").href = APP_STORE;
      $("store-android").href = playUrl();
    } else {
      $("download").hidden = false;
      $("download").href = platform === "android" ? playUrl() : APP_STORE;
      $("stores").hidden = true;
    }
    $("code-label").textContent = s("code_label");
    $("code-value").textContent = code.slice(0, 4) + "-" + code.slice(4);
    $("copy").textContent = s("copy");
    $("code-hint").textContent = s("code_hint");
    $("closed").hidden = true;
    $("open").hidden = false;
  }

  $("langs").addEventListener("click", function (event) {
    var target = event.target.closest ? event.target.closest("button[data-lang]") : null;
    if (!target) return;
    lang = target.getAttribute("data-lang");
    render();
  });
  $("copy").addEventListener("click", function () {
    var text = $("code-value").textContent;
    var done = function () { $("copy").textContent = s("copied"); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () {});
  });
  $("learn").href = LANDING;
  if (inApp) $("in-app").hidden = false;
  render();
})();
</script>
